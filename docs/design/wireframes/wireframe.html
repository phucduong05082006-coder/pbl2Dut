<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23285b43'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23f5f3ec'/%3E%3C/svg%3E">
  <title>FRAME — Wireframe quản lý rạp</title>
  <style>
    :root { --paper:#f5f3ec; --surface:#fffefa; --ink:#25312c; --muted:#627068; --line:#dbdfd4; --green:#285b43; --green-light:#e8efe4; --orange:#bd4129; --sold:#e4e6df; --error:#9c2929; --serif:Georgia,'Times New Roman',serif; --body:'Trebuchet MS',Verdana,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 var(--body); }
    button,input,select { font:inherit; }
    button,a,input,select { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; }
    button,input,select { min-height:44px; }
    button { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; padding:9px 15px; transition:background .15s,color .15s; }
    button:hover:not(:disabled) { background:var(--green-light); }
    button:active:not(:disabled) { filter:brightness(.94); }
    :focus-visible { outline:3px solid var(--orange); outline-offset:3px; }
    input,select { width:100%; border:1px solid #879589; border-radius:5px; padding:10px 12px; background:var(--surface); color:var(--ink); }
    input[type=checkbox] { width:22px; min-height:22px; height:22px; accent-color:var(--green); }
    label { display:grid; gap:6px; font-size:14px; font-weight:bold; }
    h1,h2,h3,p { margin:0; }
    h1 { font:normal clamp(30px,3.2vw,45px)/1.15 var(--serif); letter-spacing:-1px; }
    h2 { font-size:20px; }
    h3 { font-size:17px; }
    a { color:var(--green); }
    small,.muted { color:var(--muted); }
    small { font-size:13px; }
    .primary { background:var(--green); border-color:var(--green); color:#fff; font-weight:bold; }
    .primary:hover:not(:disabled) { background:#1c4431; }
    .primary:disabled { background:var(--sold); color:#59645e; border-color:var(--line); }
    .eyebrow { color:var(--green); font-size:12px; letter-spacing:2px; font-weight:bold; text-transform:uppercase; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:4px; background:var(--green-light); color:var(--green); font-size:12px; font-weight:bold; white-space:nowrap; }
    .pill.neutral { background:var(--sold); color:#515d56; }
    .pill.demo { background:#f6e8d5; color:#805113; }
    .error { color:var(--error); font-weight:bold; }
    .row { display:flex; align-items:center; gap:12px; }
    .between { justify-content:space-between; }
    .wrap { flex-wrap:wrap; }
    .stack { display:grid; gap:20px; }
    .icon { width:20px; height:20px; flex-shrink:0; vertical-align:middle; }
    .skip { position:fixed; top:-100px; left:20px; z-index:5; padding:12px; background:var(--surface); }
    .skip:focus { top:12px; }
    .shell { display:grid; grid-template-columns:230px minmax(0,1fr); min-height:100vh; }
    .sidebar { padding:30px 18px 20px; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100vh; }
    .brand { padding:0 12px; min-width:0; }
    .brand b { font-size:29px; letter-spacing:5px; display:block; }
    .brand small { letter-spacing:2px; font-size:10px; }
    .brand-mark { color:var(--orange); }
    nav { display:grid; gap:6px; min-width:0; }
    .nav-item { width:100%; display:flex; align-items:center; gap:12px; text-align:left; border:0; background:transparent; color:var(--muted); padding:12px; }
    .nav-item[aria-current=page] { background:var(--green-light); color:var(--green); font-weight:bold; }
    .sidebar-note { margin-top:auto; padding:16px 12px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); }
    .content { min-width:0; }
    .topbar { min-height:77px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 32px; border-bottom:1px solid var(--line); background:rgba(255,254,250,.65); }
    .topbar .user { font-size:14px; }
    main { padding:32px; max-width:1550px; margin:auto; }
    .page-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; }
    .page-heading .eyebrow { margin-bottom:8px; }
    .page-heading p { margin-top:10px; font-size:14px; color:var(--muted); }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:24px; min-width:0; }
    .panel-heading { padding-bottom:16px; margin-bottom:20px; border-bottom:1px solid var(--line); }
    .sales-layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:24px; }
    .steps { display:flex; gap:22px; font-size:12px; font-weight:bold; color:var(--muted); margin-bottom:24px; flex-wrap:wrap; }
    .steps span { display:flex; align-items:center; gap:7px; }
    .steps b { display:grid; place-items:center; width:24px; height:24px; border:1px solid var(--line); border-radius:50%; }
    .steps .current { color:var(--green); }
    .steps .current b { background:var(--green); color:white; border-color:var(--green); }
    .filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .filters label { flex:1; min-width:140px; }
    .show-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:26px; }
    .show-option { padding:14px; text-align:left; min-width:0; border-radius:7px; }
    .show-option strong { display:block; font-size:20px; margin-bottom:4px; }
    .show-option span,.show-option small { display:block; font-size:12px; }
    .show-option[aria-pressed=true] { background:var(--green); border-color:var(--green); color:white; }
    .show-option[aria-pressed=true] small { color:#e0eadc; }
    .screen { width:75%; margin:12px auto 24px; border-top:4px solid #a7b9a7; border-radius:50% 50% 0 0; padding-top:10px; text-align:center; font-size:10px; font-weight:bold; letter-spacing:4px; color:var(--muted); }
    .seat-grid { display:grid; grid-template-columns:repeat(var(--columns,8),minmax(0,44px)); gap:9px; justify-content:center; margin:16px auto 22px; }
    .seat { width:100%; min-width:0; height:44px; padding:0; font-size:12px; font-weight:bold; border:1px solid #829781; border-radius:7px 7px 3px 3px; box-shadow:0 3px 0 #d2d9cc; }
    .seat[aria-pressed=true] { background:var(--green); color:white; border-color:var(--green); box-shadow:0 3px 0 #183b29; }
    .seat:disabled { background:var(--sold); color:#687269; border-color:var(--sold); box-shadow:0 3px 0 #d3d7ce; }
    .seat:disabled::after { content:' ×'; }
    .legend { display:flex; justify-content:center; flex-wrap:wrap; gap:18px; font-size:12px; color:var(--muted); }
    .legend span { display:flex; align-items:center; gap:6px; }
    .swatch { width:13px; height:13px; border-radius:3px; border:1px solid #829781; display:inline-block; }
    .swatch.selected { background:var(--green); }
    .swatch.sold { background:var(--sold); border-color:var(--sold); }
    .seat-note { text-align:center; font-size:12px; color:var(--muted); margin-top:18px; }
    .order { align-self:start; position:sticky; top:20px; padding:0; overflow:hidden; }
    .order-head { padding:22px 24px; background:var(--ink); color:var(--surface); }
    .order-head .eyebrow { color:#b8ceb7; margin-bottom:8px; }
    .order-body { padding:24px; }
    .order-body h3 { font:24px var(--serif); margin-bottom:8px; }
    .order-line { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0; font-size:14px; }
    .seat-tags { display:flex; flex-wrap:wrap; gap:7px; min-height:46px; padding:10px 0; }
    .total { border-top:1px dashed var(--line); margin-top:18px; padding-top:18px; }
    .total strong { font-size:27px; letter-spacing:-1px; }
    .order-actions { display:grid; gap:10px; margin-top:20px; }
    .order-foot { padding:16px 24px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); }
    .notice { background:var(--green-light); padding:14px 18px; border-left:3px solid var(--green); border-radius:4px; margin-top:20px; font-size:13px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; text-align:left; }
    th { font-size:11px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; white-space:nowrap; }
    th,td { padding:14px 12px; border-bottom:1px solid var(--line); }
    td:first-child,th:first-child { padding-left:0; }
    td small { display:block; }
    td .actions { display:flex; gap:8px; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
    .metric { padding:24px; }
    .metric strong { font:36px var(--serif); display:block; margin-top:10px; }
    .room-card .room-number { font:48px var(--serif); color:var(--green); margin-bottom:12px; }
    .room-card .row { margin:16px 0; }
    .film-art { height:125px; background:linear-gradient(140deg,#eadcc5,#d4dfce); border-radius:5px; display:flex; align-items:center; padding:20px; margin-bottom:20px; overflow:hidden; }
    .film-art b { font:42px var(--serif); transform:rotate(-6deg); opacity:.6; }
    .room-card button,.film-card button { margin-top:14px; }
    .empty { padding:32px; text-align:center; color:var(--muted); }
    .login { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
    .login-art { padding:clamp(30px,6vw,85px); display:flex; flex-direction:column; justify-content:space-between; color:var(--surface); background:radial-gradient(ellipse at 25% 0%,#46654b,transparent 60%),var(--ink); }
    .login-art .brand { padding:0; }
    .login-art small { color:#dae3d4; }
    .login-art h1 { font-size:clamp(45px,5.8vw,85px); line-height:1.05; margin:40px 0 24px; }
    .login-art .eyebrow { color:#c7d4ad; }
    .login-form { align-self:center; width:min(100%,460px); padding:36px; margin:auto; }
    .login-form h2 { font:38px var(--serif); margin:12px 0; }
    .login-form form { display:grid; gap:20px; margin-top:28px; }
    .login-ticket { padding:22px; border:1px dashed #8b9a81; border-radius:8px; margin:34px 0; font-family:monospace; letter-spacing:2px; }
    dialog { width:min(560px,calc(100% - 32px)); border:1px solid var(--line); border-radius:12px; padding:28px; background:var(--surface); color:var(--ink); max-height:85vh; overflow:auto; }
    dialog::backdrop { background:rgba(28,41,33,.6); }
    dialog h2 { font:29px var(--serif); }
    dialog form { display:grid; gap:16px; margin-top:20px; }
    .check-label { display:flex; align-items:center; gap:12px; min-height:44px; }
    .receipt { border-block:1px dashed var(--line); padding:16px 0; margin:18px 0; }
    .receipt .row { margin:9px 0; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); padding:14px 20px; background:var(--ink); color:var(--surface); border-radius:6px; z-index:10; box-shadow:0 6px 24px #0002; }
    .toast:empty { display:none; }
    .reveal { animation:enter .25s ease-out; }
    @keyframes enter { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:1150px) { .sales-layout { grid-template-columns:minmax(0,1fr) 275px; gap:16px; } .shell { grid-template-columns:200px minmax(0,1fr); } main { padding:24px; } .panel { padding:20px; } .order { padding:0; } .show-list { grid-template-columns:repeat(2,minmax(0,1fr)); } .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:950px) { .sales-layout { grid-template-columns:1fr; } .order { position:static; } .order-body { display:grid; grid-template-columns:1fr 1fr; gap:20px; } .topbar { padding:15px 24px; } }
    @media (max-width:700px) { .shell { grid-template-columns:1fr; } .sidebar { width:100%; min-width:0; height:auto; position:static; padding:16px; gap:16px; border-right:0; border-bottom:1px solid var(--line); } .brand b { font-size:22px; } .brand { padding:0; } nav { display:flex; width:100%; overflow-x:auto; gap:6px; padding-bottom:4px; } .nav-item { width:auto; flex-shrink:0; padding:10px; font-size:13px; } .nav-item .icon { display:none; } .sidebar-note { display:none; } .topbar { padding:12px 16px; min-height:65px; } .topbar>.row { flex-wrap:wrap; gap:4px; } .topbar .user { font-size:12px; } main { padding:24px 16px; } .page-heading { align-items:flex-start; flex-wrap:wrap; } .cards { grid-template-columns:1fr; } .order-body { display:block; } .panel { padding:16px; } .order { padding:0; } .seat-grid { gap:5px; grid-template-columns:repeat(var(--columns,8),minmax(0,1fr)); } .seat { font-size:10px; } .steps { gap:10px; font-size:11px; } .login { grid-template-columns:1fr; } .login-art { padding:28px; } .login-art h1 { font-size:42px; margin:24px 0 16px; } .login-ticket { display:none; } .login-form { padding:28px; } .filters label { min-width:120px; } th,td { padding:12px 8px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Bỏ qua điều hướng</a>
  <div id="app"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Bản mẫu tương tác cần JavaScript. Không cần kết nối Internet.</noscript>
  <script>
    const DEMO_NOW = new Date('2026-10-11T10:00:00+07:00');
    const state = {
      session: null, view: 'sale', showId: 'SC001', selected: [], saleFilm: '', saleDate: '2026-10-11',
      reportFrom: '2026-10-11', reportTo: '2026-10-11', reportFilm: '', query: '',
      users: [
        { id:'U001', username:'manager', name:'Nguyễn Minh Anh', role:'MANAGER', canSell:true },
        { id:'U002', username:'seller01', name:'Trần Hoài An', role:'SELLER', canSell:true }
      ],
      films: [
        { id:'F001', title:'Chuyến tàu mùa thu', duration:98, rating:'P', active:true },
        { id:'F002', title:'Phía sau ánh đèn', duration:112, rating:'T13', active:true },
        { id:'F003', title:'Một ngày thật khác', duration:105, rating:'T16', active:true }
      ],
      rooms: [
        { id:'R001', name:'Phòng 01', rows:6, columns:8, active:true },
        { id:'R002', name:'Phòng 02', rows:5, columns:8, active:true },
        { id:'R003', name:'Phòng 03', rows:6, columns:8, active:true }
      ],
      shows: [
        { id:'SC001', filmId:'F001', roomId:'R001', start:'2026-10-11T11:30:00+07:00', duration:98, price:80000, status:'OPEN' },
        { id:'SC002', filmId:'F001', roomId:'R001', start:'2026-10-11T15:00:00+07:00', duration:98, price:80000, status:'OPEN' },
        { id:'SC003', filmId:'F002', roomId:'R002', start:'2026-10-11T13:00:00+07:00', duration:112, price:90000, status:'OPEN' },
        { id:'SC004', filmId:'F003', roomId:'R003', start:'2026-10-11T17:45:00+07:00', duration:105, price:85000, status:'OPEN' },
        { id:'SC005', filmId:'F002', roomId:'R002', start:'2026-10-11T16:00:00+07:00', duration:112, price:90000, status:'CLOSED' },
        { id:'SC006', filmId:'F001', roomId:'R001', start:'2026-10-11T08:00:00+07:00', duration:98, price:80000, status:'OPEN' }
      ],
      transactions: [{ id:'TX0001', showId:'SC001', createdAt:'2026-10-11T09:20:00+07:00', userId:'U002', total:560000, status:'COMPLETED', payment:'CONFIRMED' }],
      tickets: ['A01','A02','C04','C05','D06','E07','E08'].map((seat,index) => ({ id:`T${String(index+1).padStart(4,'0')}`, transactionId:'TX0001', showId:'SC001', seat, price:80000 }))
    };
    const money = amount => new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
    const filmOf = show => state.films.find(film => film.id === show.filmId);
    const roomOf = show => state.rooms.find(room => room.id === show.roomId);
    const userOf = () => state.users.find(user => user.id === state.session);
    const shortDate = value => value.slice(0,10).split('-').reverse().join('.');
    const timeOf = show => show.start.slice(11,16);
    const nextId = (prefix, records) => prefix + String(Math.max(0,...records.map(record => Number(record.id.slice(prefix.length))))+1).padStart(4,'0');
    const seatsOf = room => Array.from({length:room.rows}, (_,row) => Array.from({length:room.columns}, (_,column) => String.fromCharCode(65+row)+String(column+1).padStart(2,'0'))).flat();
    const validTickets = () => state.tickets.filter(ticket => state.transactions.some(transaction => transaction.id === ticket.transactionId && transaction.status === 'COMPLETED' && transaction.payment === 'CONFIRMED'));
    const soldSeats = showId => validTickets().filter(ticket => ticket.showId === showId).map(ticket => ticket.seat);
    const isOpen = show => show.status === 'OPEN' && new Date(show.start) > DEMO_NOW && filmOf(show)?.active && roomOf(show)?.active;
    const statusOf = show => new Date(show.start) <= DEMO_NOW ? 'Đã bắt đầu' : ({ OPEN:'Mở bán', CLOSED:'Đóng bán', DRAFT:'Bản nháp', COMPLETED:'Đã kết thúc' }[show.status]);
    const requireManager = () => { if (userOf()?.role !== 'MANAGER') throw new Error('Chỉ quản lý được thực hiện thao tác này.'); };
    const requireSale = () => { if (!userOf()?.canSell) throw new Error('Tài khoản chưa được cấp quyền bán vé.'); };

    function validateSale(showId, selected) {
      requireSale();
      const show = state.shows.find(item => item.id === showId);
      if (!show || !isOpen(show)) throw new Error('Suất chiếu đã bắt đầu hoặc không còn mở bán.');
      if (!Array.isArray(selected) || !selected.length) throw new Error('Vui lòng chọn ít nhất một ghế.');
      if (new Set(selected).size !== selected.length) throw new Error('Không được chọn trùng ghế.');
      const available = seatsOf(roomOf(show));
      if (selected.some(seat => !available.includes(seat))) throw new Error('Ghế không thuộc phòng chiếu.');
      if (selected.some(seat => soldSeats(showId).includes(seat))) throw new Error('Ghế đã bán. Vui lòng chọn lại.');
      if (!Number.isSafeInteger(show.price) || show.price <= 0 || !Number.isSafeInteger(show.price * selected.length)) throw new Error('Giá vé hoặc tổng tiền không hợp lệ.');
      return show;
    }

    function completeSale(showId, selected, confirmed) {
      const show = validateSale(showId, selected);
      if (!confirmed) throw new Error('Cần xác nhận đã nhận đủ tiền mặt.');
      const transaction = { id:nextId('TX',state.transactions), showId, createdAt:'2026-10-11T10:00:00+07:00', userId:state.session, total:selected.length*show.price, status:'COMPLETED', payment:'CONFIRMED' };
      const firstTicket = Number(nextId('T',state.tickets).slice(1));
      const tickets = selected.map((seat,index) => ({ id:'T'+String(firstTicket+index).padStart(4,'0'), transactionId:transaction.id, showId, seat, price:show.price }));
      // ponytail: giao dịch chỉ mô phỏng trong bộ nhớ; thêm lưu TXT nguyên tử khi triển khai sản phẩm.
      state.transactions = [...state.transactions,transaction];
      state.tickets = [...state.tickets,...tickets];
      return transaction;
    }

    function validateSchedule(candidate) {
      requireManager();
      const film = filmOf(candidate), room = roomOf(candidate), start = new Date(candidate.start).getTime();
      if (!film?.active || !room?.active) throw new Error('Phim và phòng phải đang hoạt động.');
      if (!Number.isFinite(start) || start <= DEMO_NOW.getTime()) throw new Error('Thời điểm bắt đầu phải sau giờ mô phỏng.');
      if (!Number.isSafeInteger(candidate.price) || candidate.price <= 0) throw new Error('Giá vé phải là số nguyên VND lớn hơn 0 trong bản mẫu.');
      const until = start + (film.duration+15)*60000;
      if (state.shows.some(show => show.roomId === candidate.roomId && start < new Date(show.start).getTime()+(show.duration+15)*60000 && new Date(show.start).getTime() < until)) throw new Error('Lịch bị trùng trong cùng phòng, tính cả 15 phút nghỉ.');
      return { ...candidate, duration:film.duration };
    }

    function reportData() {
      if (state.reportFrom > state.reportTo) throw new Error('Ngày bắt đầu phải trước hoặc bằng ngày kết thúc.');
      const transactions = state.transactions.filter(transaction => transaction.status === 'COMPLETED' && transaction.payment === 'CONFIRMED' && transaction.createdAt.slice(0,10) >= state.reportFrom && transaction.createdAt.slice(0,10) <= state.reportTo);
      const tickets = validTickets().filter(ticket => transactions.some(transaction => transaction.id === ticket.transactionId) && (!state.reportFilm || state.shows.find(show => show.id === ticket.showId)?.filmId === state.reportFilm));
      const groups = state.shows.filter(show => (!state.reportFilm || show.filmId === state.reportFilm) && tickets.some(ticket => ticket.showId === show.id)).map(show => {
        const items = tickets.filter(ticket => ticket.showId === show.id);
        return { show, count:items.length, revenue:items.reduce((total,ticket) => total+ticket.price,0), occupancy:Math.round(items.length/seatsOf(roomOf(show)).length*100) };
      });
      return { tickets, groups, revenue:tickets.reduce((total,ticket) => total+ticket.price,0) };
    }

    const icons = {
      overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',

      reports:'M4 20h17 M7 16V9 M12 16V4 M17 16v-5',
      users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M22 21v-3a4 4 0 0 0-3-4'
    };
    const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name] || icons.sale}"/></svg>`;
    const views = { overview:['Tổng quan','01 / Vận hành'], sale:['Bán vé tại quầy','02 / Quầy vé'], films:['Quản lý phim','03 / Danh mục'], rooms:['Phòng & sơ đồ ghế','04 / Không gian'], shows:['Lịch chiếu','05 / Điều phối'], query:['Tra cứu vé & giao dịch','06 / Tra cứu'], reports:['Báo cáo doanh thu','07 / Thống kê'], users:['Tài khoản & quyền','08 / Người dùng'] };
    const descriptions = { overview:'Một góc nhìn nhanh về hoạt động của rạp.', sale:'Chọn suất chiếu, chọn ghế và xác nhận thanh toán.', films:'Danh mục phim được khai thác tại rạp.', rooms:'Mỗi phòng một sơ đồ. Chỉ sử dụng ghế tiêu chuẩn.', shows:'Sắp lịch hợp lệ. Luôn tính 15 phút chuẩn bị phòng.', query:'Đối chiếu vé và giao dịch đã phát hành.', reports:'Chỉ tính giao dịch đã xác nhận thanh toán.', users:'Quyền quản lý và quyền bán vé được kiểm soát riêng.' };

    function loginView() {
      return `<div class="login"><section class="login-art"><div class="brand"><b>FRAME<span class="brand-mark">.</span></b><small>CINEMA OPERATIONS</small></div><div><div class="eyebrow">Hậu trường của mỗi suất chiếu</div><h1>Vận hành gọn.<br>Trải nghiệm trọn.</h1><p>Từ một chiếc ghế trống đến một tấm vé hoàn chỉnh.</p><div class="login-ticket">ADMIT ONE / CINEMA DESK<br><br>11.10.2026 &nbsp; · &nbsp; OFFLINE PROTOTYPE</div></div><small>Bản mẫu giao diện · Không phải hệ thống vận hành thật</small></section><main id="main" class="login-form"><span class="pill demo">WIREFRAME / v0.1</span><h2>Chào mừng trở lại.</h2><p class="muted">Đăng nhập tài khoản mẫu để khám phá luồng vận hành.</p><form id="login-form"><label for="username">Tên đăng nhập<input id="username" name="username" autocomplete="username" value="manager" required></label><label for="password">Mật khẩu mẫu<input id="password" name="password" type="password" autocomplete="current-password" value="demo123" required></label><p id="login-error" class="error" role="alert"></p><button class="primary" type="submit">Vào quầy vận hành →</button></form><div class="notice">Quản lý: <b>manager</b> · Nhân viên: <b>seller01</b><br>Mật khẩu mẫu: <b>demo123</b><br>Dữ liệu giả, mất khi tải lại. Không nhập thông tin thật.</div></main></div>`;
    }

    function navigate(view) {
      if (!(view in views)) return;
      if (!['sale','query'].includes(view)) requireManager();
      state.view = view;
      state.selected = [];
      render();
      document.getElementById('main').focus();
    }

    function render() {
      if (!userOf()) { document.getElementById('app').innerHTML = loginView(); document.getElementById('login-form').addEventListener('submit',login); return; }
      const user = userOf(), manager = user.role === 'MANAGER';
      if (!manager && !['sale','query'].includes(state.view)) state.view = 'sale';
      const navigation = Object.entries(views).filter(([view]) => manager || ['sale','query'].includes(view)).map(([view,[title]]) => `<button class="nav-item" data-view="${view}" ${state.view===view?'aria-current="page"':''}>${icon(view)}${title}</button>`).join('');
      const actions = { films:['film','Thêm phim'], rooms:['room','Thêm phòng'], shows:['show','Tạo suất chiếu'] };
      const action = actions[state.view];
      const content = { sale:saleView, overview:overviewView, films:filmsView, rooms:roomsView, shows:showsView, query:queryView, reports:reportsView, users:usersView }[state.view]();
      document.getElementById('app').innerHTML = `<div class="shell"><aside class="sidebar"><div class="brand"><b>FRAME<span class="brand-mark">.</span></b><small>CINEMA OPERATIONS</small></div><nav aria-label="Điều hướng chính">${navigation}</nav><div class="sidebar-note"><b>Rạp mẫu / 01</b><br>3 phòng chiếu · Hoạt động offline<br><br>Dữ liệu giả trong bộ nhớ.<br>Tải lại sẽ đặt lại toàn bộ.</div></aside><div class="content"><header class="topbar"><div class="row"><span class="pill demo">BẢN MẪU</span><small>11.10.2026 · 10:00 / giờ mô phỏng</small></div><div class="row"><div class="user"><b>${escapeHtml(user.name)}</b><br><small>${manager?'Quản lý rạp':'Nhân viên bán vé'}</small></div><button id="logout">Đăng xuất</button></div></header><main id="main" tabindex="-1"><div class="page-heading"><div><div class="eyebrow">${views[state.view][1]}</div><h1>${views[state.view][0]}</h1><p>${descriptions[state.view]}</p></div>${action?`<button class="primary" data-editor="${action[0]}">+ ${action[1]}</button>`:'<span class="pill">● Hoạt động offline</span>'}</div><div class="reveal">${content}</div></main></div></div>`;
      bindView();
    }

    function saleView() {
      const visible = state.shows.filter(show => isOpen(show) && show.start.slice(0,10) === state.saleDate && (!state.saleFilm || show.filmId === state.saleFilm));
      if (!visible.some(show => show.id === state.showId)) { state.showId = visible[0]?.id || ''; state.selected = []; }
      const show = state.shows.find(item => item.id === state.showId);
      const room = show && roomOf(show), sold = show ? soldSeats(show.id) : [];
      const filmOptions = state.films.filter(film => film.active).map(film => `<option value="${film.id}" ${state.saleFilm===film.id?'selected':''}>${escapeHtml(film.title)}</option>`).join('');
      const options = visible.map(item => `<button class="show-option" data-show="${item.id}" aria-pressed="${item.id===state.showId}"><strong>${timeOf(item)}</strong><span>${escapeHtml(filmOf(item).title)}</span><small>${escapeHtml(roomOf(item).name)} · ${money(item.price)}</small></button>`).join('');
      const seats = show ? seatsOf(room).map(seat => `<button class="seat" data-seat="${seat}" aria-label="Ghế ${seat}${sold.includes(seat)?', đã bán':''}" aria-pressed="${state.selected.includes(seat)}" ${sold.includes(seat)||!userOf().canSell?'disabled':''}>${seat}</button>`).join('') : '';
      return `<div class="steps"><span><b>1</b> Chọn suất chiếu</span><span class="current"><b>2</b> Chọn ghế</span><span><b>3</b> Xác nhận thanh toán</span></div><div class="sales-layout"><section class="panel"><div class="panel-heading row between wrap"><h2>Suất chiếu & vị trí ngồi</h2><small>${show?sold.length+' / '+seatsOf(room).length+' ghế đã bán':'Chưa có suất phù hợp'}</small></div><div class="filters"><label>Ngày chiếu<input id="sale-date" type="date" value="${state.saleDate}" required></label><label>Phim<select id="sale-film"><option value="">Tất cả phim</option>${filmOptions}</select></label></div><div class="show-list">${options || '<p class="empty">Không có suất đang mở bán cho lựa chọn này.</p>'}</div>${show?`<div class="row between wrap"><h3>${escapeHtml(room.name)}</h3><small>${shortDate(show.start)} · ${timeOf(show)} · ${filmOf(show).rating}</small></div><div class="screen">MÀN HÌNH</div><div class="seat-grid" style="--columns:${room.columns}" role="group" aria-label="Chọn ghế ${escapeHtml(room.name)}">${seats}</div><div class="legend"><span><i class="swatch"></i>Còn trống</span><span><i class="swatch selected"></i>Đang chọn ✓</span><span><i class="swatch sold"></i>Đã bán ×</span></div><p class="seat-note">Ghế đang chọn chưa được giữ chỗ. Kiểm tra lại khi xác nhận.</p>`:''}</section><aside class="panel order"><div class="order-head"><div class="eyebrow">Thông tin giao dịch</div><h2>Vé của khách</h2></div><div class="order-body"><div><h3>${show?escapeHtml(filmOf(show).title):'Chưa chọn suất'}</h3><p class="muted">${show?escapeHtml(room.name)+' · '+timeOf(show):'Chọn một suất đang mở bán'}</p><div class="order-line"><span>Ghế đã chọn</span><b id="seat-count">${state.selected.length} vé</b></div><div id="seat-tags" class="seat-tags">${selectionTags()}</div><div class="order-line"><span>Giá mỗi vé</span><b>${show?money(show.price):'—'}</b></div></div><div><div class="order-line total"><span>Tổng thanh toán</span><strong id="sale-total">${money(state.selected.length*(show?.price || 0))}</strong></div><div class="order-actions"><button id="checkout" class="primary" ${state.selected.length&&userOf().canSell?'':'disabled'}>Kiểm tra & thanh toán →</button><button id="clear-seats" ${state.selected.length?'':'disabled'}>Bỏ lựa chọn</button></div>${!userOf().canSell?'<p class="error">Tài khoản chưa có quyền bán vé.</p>':''}</div></div><div class="order-foot">Tiền mặt · Chỉ phát hành vé sau khi xác nhận đủ tiền. Nhân viên kiểm tra điều kiện độ tuổi thực tế.</div></aside></div><div class="notice">Bản mẫu chỉ mô phỏng giao dịch trong bộ nhớ; chưa ghi file TXT, chưa giữ ghế và không hỗ trợ hủy/hoàn vé.</div>`;
    }

    const selectionTags = () => state.selected.length ? state.selected.map(seat => `<span class="pill">${seat} ✓</span>`).join('') : '<small>Chọn ghế trên sơ đồ bên trái.</small>';
    function updateSelection() {
      const show = state.shows.find(item => item.id === state.showId);
      document.querySelectorAll('[data-seat]').forEach(button => button.setAttribute('aria-pressed',state.selected.includes(button.dataset.seat)));
      document.getElementById('seat-count').textContent = state.selected.length+' vé';
      document.getElementById('seat-tags').innerHTML = selectionTags();
      document.getElementById('sale-total').textContent = money(state.selected.length*show.price);
      document.getElementById('checkout').disabled = !state.selected.length || !userOf().canSell;
      document.getElementById('clear-seats').disabled = !state.selected.length;
    }

    function metric(label,value,note) { return `<div class="panel metric"><small>${label}</small><strong>${value}</strong><small>${note}</small></div>`; }
    function overviewView() {
      const tickets = validTickets(), revenue = tickets.reduce((total,ticket) => total+ticket.price,0);
      return `<div class="stack"><div class="cards">${metric('Vé đã bán',tickets.length,'Dữ liệu mẫu hôm nay')}${metric('Doanh thu bán vé',money(revenue),'Không bao gồm lợi nhuận')}${metric('Suất đang mở bán',state.shows.filter(isOpen).length,'Sau 10:00 ngày mô phỏng')}</div><section class="panel"><div class="panel-heading row between"><h2>Lịch chiếu trong ngày</h2><button data-view="shows">Xem lịch chiếu →</button></div>${showTable()}</section><div class="notice">Điểm kiểm soát: không trùng lịch, không bán trùng ghế và không phát hành vé trước thanh toán.</div></div>`;
    }

    function filmsView() {
      return `<div class="cards">${state.films.map((film,index) => `<article class="panel film-card"><div class="film-art"><b>FRAME / ${String(index+1).padStart(2,'0')}</b></div><span class="pill ${film.active?'':'neutral'}">${film.active?'Đang khai thác':'Ngừng khai thác'}</span><h2 style="margin-top:14px">${escapeHtml(film.title)}</h2><p class="muted">${film.duration} phút · ${escapeHtml(film.rating)}</p><small>${film.id}</small><br><button data-editor="film" data-id="${film.id}">Chỉnh sửa thông tin</button></article>`).join('')}</div>`;
    }

    function roomsView() {
      return `<div class="cards">${state.rooms.map((room,index) => `<article class="panel room-card"><div class="room-number">${String(index+1).padStart(2,'0')}</div><h2>${escapeHtml(room.name)}</h2><div class="row"><span class="pill">${seatsOf(room).length} ghế</span><span class="pill neutral">Tiêu chuẩn</span></div><p class="muted">${room.rows} hàng × ${room.columns} ghế</p><button data-room="${room.id}">Xem sơ đồ phòng →</button></article>`).join('')}</div><div class="notice">Ghế đã bán được xác định riêng cho từng suất chiếu, không phải trạng thái của phòng.</div>`;
    }

    function showTable() {
      return `<div class="table-wrap"><table><caption class="muted" style="text-align:left;padding-bottom:12px">Ngày chiếu 11.10.2026 và các suất được thêm trong phiên thử</caption><thead><tr><th>Phim / Mã suất</th><th>Phòng</th><th>Bắt đầu</th><th>Giá vé</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${[...state.shows].sort((first,second) => new Date(first.start)-new Date(second.start)).map(show => `<tr><td><b>${escapeHtml(filmOf(show).title)}</b><small>${show.id}</small></td><td>${escapeHtml(roomOf(show).name)}</td><td>${shortDate(show.start)}<br><b>${timeOf(show)}</b></td><td>${money(show.price)}</td><td><span class="pill ${isOpen(show)?'':'neutral'}">${statusOf(show)}</span></td><td><button data-status="${show.id}" ${new Date(show.start)<=DEMO_NOW?'disabled':''}>${show.status==='OPEN'?'Đóng bán':'Mở bán'}</button></td></tr>`).join('')}</tbody></table></div>`;
    }
    function showsView() { return `<section class="panel">${showTable()}</section><div class="notice">Suất nháp và suất đóng bán vẫn chiếm lịch phòng. Không chỉnh phim, phòng hoặc giờ chiếu của suất đã có vé bán.</div>`; }

    function queryView() {
      const query = state.query.trim().toUpperCase();
      const ticket = state.tickets.find(item => item.id === query);
      const found = state.transactions.filter(transaction => !query || transaction.id === query || transaction.id === ticket?.transactionId);
      return `<section class="panel"><form id="query-form" class="row wrap" style="align-items:end;margin-bottom:24px"><label style="flex:1">Mã giao dịch hoặc mã vé<input name="query" value="${escapeHtml(state.query)}" placeholder="Ví dụ TX0001 hoặc T0001"></label><button class="primary" type="submit">Tra cứu</button></form>${found.length?`<div class="table-wrap"><table><thead><tr><th>Giao dịch</th><th>Phim / Suất</th><th>Ghế / Vé</th><th>Nhân viên</th><th>Tổng tiền</th></tr></thead><tbody>${[...found].reverse().map(transaction => {
        const show = state.shows.find(item => item.id === transaction.showId), tickets = validTickets().filter(item => item.transactionId === transaction.id);
        return `<tr><td><b>${transaction.id}</b><small>Đã thanh toán · ${shortDate(transaction.createdAt)}</small></td><td>${escapeHtml(filmOf(show).title)}<small>${timeOf(show)} · ${escapeHtml(roomOf(show).name)}</small></td><td>${tickets.map(item => `<b>${item.seat}</b> <small>${item.id} · ${money(item.price)}</small>`).join('')}</td><td>${escapeHtml(state.users.find(user => user.id === transaction.userId).name)}</td><td><b>${money(transaction.total)}</b></td></tr>`;
      }).join('')}</tbody></table></div>`:'<div class="empty">Không tìm thấy mã vé hoặc giao dịch này.</div>'}</section>`;
    }

    function reportsView() {
      const filters = `<form id="report-form" class="filters"><label>Từ ngày<input name="from" type="date" value="${state.reportFrom}" required></label><label>Đến ngày<input name="to" type="date" value="${state.reportTo}" required></label><label>Phim<select name="film"><option value="">Tất cả phim</option>${state.films.map(film => `<option value="${film.id}" ${film.id===state.reportFilm?'selected':''}>${escapeHtml(film.title)}</option>`).join('')}</select></label><button class="primary" style="align-self:end" type="submit">Áp dụng bộ lọc</button></form>`;
      let report;
      try { report = reportData(); } catch (error) { return `<section class="panel">${filters}<p class="error" role="alert">${escapeHtml(error.message)}</p></section>`; }
      return `<div class="stack"><section class="panel">${filters}</section><div class="cards">${metric('Doanh thu',money(report.revenue),'Theo thời điểm giao dịch')}${metric('Vé đã phát hành',report.tickets.length,'Mỗi vé tương ứng một ghế')}${metric('Suất có vé trong bộ lọc',report.groups.length,'Lấp đầy hiển thị theo từng suất')}</div><section class="panel"><h2 style="margin-bottom:20px">Chi tiết theo suất chiếu</h2><div class="table-wrap"><table><thead><tr><th>Phim / Suất</th><th>Ghế đã bán</th><th>Tỷ lệ theo bộ lọc</th><th>Doanh thu</th></tr></thead><tbody>${report.groups.map(group => `<tr><td>${escapeHtml(filmOf(group.show).title)}<small>${group.show.id} · ${timeOf(group.show)}</small></td><td>${group.count} / ${seatsOf(roomOf(group.show)).length}</td><td>${group.occupancy}%</td><td><b>${money(group.revenue)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Không có giao dịch trong phạm vi này.</td></tr>'}</tbody></table></div></section></div>`;
    }

    function usersView() {
      return `<section class="panel"><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Tên hiển thị</th><th>Vai trò</th><th>Quyền bán vé</th><th>Thao tác</th></tr></thead><tbody>${state.users.map(user => `<tr><td><b>${user.username}</b><small>${user.id}</small></td><td>${escapeHtml(user.name)}</td><td>${user.role==='MANAGER'?'Quản lý':'Nhân viên'}</td><td><span class="pill ${user.canSell?'':'neutral'}">${user.canSell?'Được cấp':'Chưa cấp'}</span></td><td><button data-permission="${user.id}">${user.canSell?'Thu hồi':'Cấp quyền'}</button></td></tr>`).join('')}</tbody></table></div></section><div class="notice">Đăng nhập trong bản mẫu chỉ để kiểm tra giao diện theo vai trò; không phải cơ chế bảo mật thật.</div>`;
    }

    function login(event) {
      event.preventDefault();
      const values = new FormData(event.target), user = state.users.find(item => item.username === values.get('username').trim());
      if (!user || values.get('password') !== 'demo123') { document.getElementById('login-error').textContent = 'Thông tin đăng nhập không hợp lệ. Dùng tài khoản mẫu bên dưới.'; return; }
      state.session = user.id;
      state.view = 'sale';
      render();
      document.getElementById('main').focus();
    }

    function toast(message) {
      const node = document.getElementById('toast');
      node.textContent = message;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.textContent = '',4500);
    }

    function openModal(content) {
      const modal = document.getElementById('modal');
      modal.innerHTML = content;
      modal.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click',() => modal.close()));
      modal.showModal();
      return modal;
    }

    function checkout() {
      let show;
      try { show = validateSale(state.showId,state.selected); } catch (error) { toast(error.message); return; }
      const selected = [...state.selected];
      const modal = openModal(`<span class="eyebrow">Kiểm tra lần cuối</span><h2 id="modal-title">Xác nhận thanh toán</h2><div class="receipt"><h3>${escapeHtml(filmOf(show).title)}</h3><div class="row between"><span>Phòng / Suất</span><b>${escapeHtml(roomOf(show).name)} · ${timeOf(show)}</b></div><div class="row between"><span>Ghế</span><b>${selected.join(', ')}</b></div><div class="row between"><span>Tổng tiền mặt</span><b>${money(selected.length*show.price)}</b></div></div><form id="checkout-form"><label class="check-label"><input name="paid" type="checkbox" required> Tôi đã nhận đủ tiền mặt từ khách hàng</label><p id="checkout-error" class="error" role="alert"></p><div class="row wrap"><button class="primary" type="submit">Xác nhận & phát hành vé</button><button type="button" data-close>Quay lại</button></div></form><small>Giao dịch mô phỏng, chưa ghi xuống TXT.</small>`);
      modal.querySelector('form').addEventListener('submit',event => {
        event.preventDefault();
        try {
          const transaction = completeSale(show.id,selected,new FormData(event.target).get('paid') === 'on');
          modal.close();
          state.selected = [];
          render();
          const tickets = state.tickets.filter(ticket => ticket.transactionId === transaction.id);
          const receipt = openModal(`<span class="pill">✓ Thanh toán mô phỏng thành công</span><h2 id="modal-title" style="margin-top:16px">Vé đã sẵn sàng.</h2><div class="receipt"><h3>${escapeHtml(filmOf(show).title)}</h3><p>${shortDate(show.start)} · ${timeOf(show)} · ${escapeHtml(roomOf(show).name)}</p><p><b>Mã giao dịch: ${transaction.id}</b></p>${tickets.map(ticket => `<div class="row between"><b>Ghế ${ticket.seat}</b><span>${ticket.id} · ${money(ticket.price)}</span></div>`).join('')}<div class="row between"><b>Tổng tiền</b><b>${money(transaction.total)}</b></div></div><button class="primary" data-close>Tiếp tục bán vé</button>`);
          receipt.addEventListener('close',() => document.getElementById('main').focus(),{once:true});
        } catch (error) { modal.querySelector('#checkout-error').textContent = error.message; }
      });
    }

    function editor(kind,id) {
      requireManager();
      const film = kind === 'film' && state.films.find(item => item.id === id);
      const titles = { film:film?'Chỉnh sửa phim':'Thêm phim', room:'Thêm phòng chiếu', show:'Tạo suất chiếu' };
      let fields = '';
      if (kind === 'film') fields = `<label>Tên phim *<input name="title" maxlength="200" value="${film?escapeHtml(film.title):''}" required></label><label>Thời lượng (phút) *<input name="duration" type="number" min="1" max="600" step="1" value="${film?.duration || 100}" required></label><label>Phân loại độ tuổi *<select name="rating">${['P','K','T13','T16','T18','C'].map(rating => `<option ${film?.rating===rating?'selected':''}>${rating}</option>`).join('')}</select></label><label>Trạng thái<select name="active"><option value="1">Đang khai thác</option><option value="0" ${film&&!film.active?'selected':''}>Ngừng khai thác</option></select></label>`;
      if (kind === 'room') fields = `<label>Tên phòng *<input name="name" maxlength="100" required></label><label>Số hàng *<input name="rows" type="number" min="1" max="8" step="1" value="6" required></label><label>Ghế mỗi hàng *<input name="columns" type="number" min="1" max="8" step="1" value="8" required></label><small>Bản mẫu giới hạn 8 × 8; sơ đồ ghế tự tạo theo hàng/cột.</small>`;
      if (kind === 'show') fields = `<label>Phim *<select name="filmId" required>${state.films.filter(item => item.active).map(item => `<option value="${item.id}">${escapeHtml(item.title)}</option>`).join('')}</select></label><label>Phòng *<select name="roomId" required>${state.rooms.filter(item => item.active).map(item => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('')}</select></label><label>Bắt đầu (giờ Việt Nam) *<input name="start" type="datetime-local" value="2026-10-11T19:00" required></label><label>Giá vé (VND) *<input name="price" type="number" min="1" step="1" value="80000" required></label><label>Trạng thái<select name="status"><option value="OPEN">Mở bán</option><option value="DRAFT">Bản nháp</option></select></label>`;
      const modal = openModal(`<span class="eyebrow">Danh mục mô phỏng</span><h2 id="modal-title">${titles[kind]}</h2><form id="editor-form">${fields}<p id="editor-error" class="error" role="alert"></p><div class="row"><button class="primary" type="submit">Lưu trong bản mẫu</button><button type="button" data-close>Hủy</button></div></form>`);
      modal.querySelector('form').addEventListener('submit',event => {
        event.preventDefault();
        try {
          requireManager();
          const values = Object.fromEntries(new FormData(event.target));
          if (kind === 'film') {
            const title = values.title.trim(), duration = Number(values.duration), active = values.active === '1';
            if (!title || !Number.isInteger(duration) || duration < 1 || duration > 600) throw new Error('Tên và thời lượng phim không hợp lệ.');
            if (/[|\r\n]/.test(title)) throw new Error('Tên không được chứa dấu | hoặc xuống dòng.');
            const related = film && state.shows.filter(show => show.filmId === film.id);
            if (related?.length && duration !== film.duration) throw new Error('Phim đã có lịch chiếu; bản mẫu chưa hỗ trợ đổi thời lượng và tính lại lịch.');
            if (!active && related?.some(show => new Date(show.start) > DEMO_NOW)) throw new Error('Phim còn suất chiếu tương lai, chưa được ngừng khai thác.');
            if (film) Object.assign(film,{ title,duration,rating:values.rating,active });
            else state.films.push({ id:nextId('F',state.films),title,duration,rating:values.rating,active });
          }
          if (kind === 'room') {
            const name = values.name.trim(), rows = Number(values.rows), columns = Number(values.columns);
            if (!name || /[|\r\n]/.test(name) || !Number.isInteger(rows) || !Number.isInteger(columns) || rows < 1 || rows > 8 || columns < 1 || columns > 8) throw new Error('Tên phòng hoặc sơ đồ ghế không hợp lệ.');
            state.rooms.push({ id:nextId('R',state.rooms), name, rows, columns, active:true });
          }
          if (kind === 'show') state.shows.push(validateSchedule({ id:nextId('SC',state.shows), filmId:values.filmId, roomId:values.roomId, start:values.start+':00+07:00', price:Number(values.price), status:values.status }));
          modal.close(); render(); toast('Đã lưu dữ liệu mẫu trong phiên này.');
        } catch (error) { modal.querySelector('#editor-error').textContent = error.message; }
      });
    }

    function bindView() {
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click',() => { try { navigate(button.dataset.view); } catch (error) { toast(error.message); } }));
      document.getElementById('logout').addEventListener('click',() => { state.session = null; state.selected = []; document.getElementById('modal').close(); render(); });
      document.querySelectorAll('[data-editor]').forEach(button => button.addEventListener('click',() => editor(button.dataset.editor,button.dataset.id)));
      document.querySelectorAll('[data-show]').forEach(button => button.addEventListener('click',() => { state.showId = button.dataset.show; state.selected = []; render(); }));
      document.querySelectorAll('[data-seat]').forEach(button => button.addEventListener('click',() => {
        try { requireSale(); state.selected = state.selected.includes(button.dataset.seat) ? state.selected.filter(seat => seat !== button.dataset.seat) : [...state.selected,button.dataset.seat]; updateSelection(); } catch (error) { toast(error.message); }
      }));
      document.getElementById('checkout')?.addEventListener('click',checkout);
      document.getElementById('clear-seats')?.addEventListener('click',() => { state.selected = []; updateSelection(); });
      document.getElementById('sale-date')?.addEventListener('change',event => { state.saleDate = event.target.value; state.selected = []; render(); });
      document.getElementById('sale-film')?.addEventListener('change',event => { state.saleFilm = event.target.value; state.selected = []; render(); });
      document.getElementById('query-form')?.addEventListener('submit',event => { event.preventDefault(); state.query = new FormData(event.target).get('query'); render(); document.querySelector('#query-form input').focus(); });
      document.getElementById('report-form')?.addEventListener('submit',event => { event.preventDefault(); requireManager(); const values = new FormData(event.target); state.reportFrom = values.get('from'); state.reportTo = values.get('to'); state.reportFilm = values.get('film'); render(); });
      document.querySelectorAll('[data-status]').forEach(button => button.addEventListener('click',() => {
        try { requireManager(); const show = state.shows.find(item => item.id === button.dataset.status); if (new Date(show.start) <= DEMO_NOW) throw new Error('Suất đã bắt đầu, không thể mở bán.'); show.status = show.status === 'OPEN' ? 'CLOSED' : 'OPEN'; render(); toast('Đã cập nhật trạng thái suất chiếu mẫu.'); } catch (error) { toast(error.message); }
      }));
      document.querySelectorAll('[data-room]').forEach(button => button.addEventListener('click',() => {
        const room = state.rooms.find(item => item.id === button.dataset.room);
        openModal(`<span class="eyebrow">Sơ đồ vật lý</span><h2 id="modal-title">${escapeHtml(room.name)}</h2><div class="screen">MÀN HÌNH</div><div class="seat-grid" style="--columns:${room.columns}">${seatsOf(room).map(seat => `<span class="seat" style="display:grid;place-items:center">${seat}</span>`).join('')}</div><p class="muted">${seatsOf(room).length} ghế tiêu chuẩn. Tình trạng bán được xem theo từng suất chiếu.</p><button data-close style="margin-top:20px">Đóng sơ đồ</button>`);
      }));
      document.querySelectorAll('[data-permission]').forEach(button => button.addEventListener('click',() => { requireManager(); const user = state.users.find(item => item.id === button.dataset.permission); user.canSell = !user.canSell; render(); toast('Quyền bán vé đã được cập nhật trong phiên mẫu.'); }));
    }
    if (typeof document !== 'undefined') render();
  </script>
</body>
</html>
